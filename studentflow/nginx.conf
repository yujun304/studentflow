server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

  location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = / {
        try_files /index.html =404;
    }

  location ~ ^/tasks/[^/]+/?$ {
        try_files /tasks/detail.html =404;
  }

  location ~ ^/proposals/[^/]+/?$ {
        try_files /proposals/detail.html =404;
  }

  location ~ ^/announcements/[^/]+/?$ {
        try_files /announcements/detail.html =404;
    }

  location ~ ^/events/[^/]+/?$ {
        try_files /events/detail.html =404;
    }

  location ~ ^/(login|tasks|community|proposals|announcements|calendar|teams|notifications|users|event-create|tutorial)/?$ {
        try_files /$1/index.html =404;
    }

  location / {
        try_files $uri =404;
    }
}
